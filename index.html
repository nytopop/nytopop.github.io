<!doctype html>
<html
  lang="en"
  x-data="{ theme: $persist('system') }"
  x-bind:class="{'dark': theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)}"
>
  <head>
    <meta charset="UTF-8" />
    <!-- FIXME: change the icon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fkit</title>
  </head>
  <body class="bg-main font-mono" x-data="app">
    <!-- TODO: selection color -->
    <!-- TODO: interface to select between tile types. builtins, custom, etc -->

    <!-- toolbar -->
    <div
      class="max-h-screen fixed inset-x-1 top-0 m-1 border-0 flex bg-stone-300 dark:bg-stone-800"
    >
      <!-- light / dark mode -->
      <!-- FIXME: pressing this should not modify selection for consistency in omni bar and config -->
      <div class="flex-1 flex">
        <div
          class="m-1 mr-0 size-5 bg-neutral-100 cursor-pointer transition-all duration-25 hover:scale-105"
          x-bind:class="{ 'border-2 border-orange-500': theme === 'light' }"
          x-on:click="theme === 'light' ? theme = 'system': theme = 'light'"
        ></div>
        <div
          class="m-1 mr-0 size-5 bg-stone-600 cursor-pointer transition-all duration-25 hover:scale-105"
          x-bind:class="{ 'border-2 border-orange-500': theme === 'dark' }"
          x-on:click="theme === 'dark' ? theme = 'system' : theme = 'dark'"
        ></div>
      </div>

      <!-- TODO
      [x] fit content up to max y size, at which point we scroll in the content area of the bar
      [x] action select list goes on the tail, also with scroll but avoid wherever possible
      [x] on selecting the input, we should open the tail as a flexbox div thing
      [ ] should persist the contents of the input, it might represent a lot
      [ ] max 5 (one line) items in the action list (rather, compress them if space is limited)
      -->

      <!-- omni bar -->
      <div
        class="flex-5 flex flex-col m-1"
        x-data="{ omni: '', text: false, list: false }"
      >
        <textarea
          placeholder="You can do anything in the omni bar. Anything at all..."
          class="w-full pl-2 p-1 bg-input text-input focus-2 boxshadow resize-none"
          x-model="omni"
          x-on:keydown.escape="$el.blur()"
          x-on:focus="text = true; autosize($el)"
          x-on:blur="text = false; $el.style.height = ''"
          x-on:input="autosize($el)"
          x-on:input.debounce.200ms="omnifunc(omni);"
          x-ref="bar"
        >
        </textarea>

        <!-- TODO: should be able to mark tiles for omni bar priority -->
        <!-- TODO: actions need +/- nice buttons to generate preference data -->
        <div
          class="text-neutral-500 dark:text-neutral-400"
          x-show="text || list"
          x-transition
        >
          <div
            class="flex-grow mt-2 m-1 p-1 bg-child boxshadow focus-1"
            tabindex="0"
            x-on:click="$el.blur()"
            x-on:keydown.enter="$el.blur()"
            x-on:keydown.escape="$refs.bar.focus()"
            x-on:focus="list = true"
            x-on:blur="list = false"
          >
            <strong>1) </strong>Breaking news!!!
          </div>

          <div
            class="flex-grow mt-2 m-1 p-1 bg-child boxshadow focus-1"
            tabindex="0"
            x-on:click="$el.blur()"
            x-on:keydown.enter="$el.blur()"
            x-on:keydown.escape="$refs.bar.focus()"
            x-on:focus="list = true"
            x-on:blur="list = false"
          >
            <strong>2) </strong>Some bullshit happened and it's NOT what you
            think!
          </div>

          <div
            class="flex-grow mt-2 m-1 p-1 bg-child boxshadow focus-1"
            tabindex="0"
            x-on:click="$el.blur()"
            x-on:keydown.enter="$el.blur()"
            x-on:keydown.escape="$refs.bar.focus()"
            x-on:focus="list = true"
            x-on:blur="list = false"
          >
            <strong>3) </strong>You'll NEVER guess what happens next!?
          </div>
        </div>
      </div>

      <!-- config button -->
      <div class="flex-1 flex justify-end">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-7 stroke-neutral-950 dark:stroke-neutral-300 cursor-pointer transition-all duration-25 hover:scale-105"
          x-bind:class="{ 'fill-orange-500': configModal }"
          x-on:click="configModal = !configModal; if (configModal) window.scrollTo(0, 0);"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          />
        </svg>
      </div>
    </div>

    <!-- config modal -->
    <div class="mt-24">
      <div
        class="flex justify-center"
        x-show="configModal"
        x-transition
        x-cloak
      >
        <ul class="border-2 bg-child text-min text-right p-1 boxshadow">
          <span class="text-lg underline text-max">Client Configuration</span>

          <li class="m-1">
            <label for="apiBaseURL">API Base URL</label>
            <input
              id="apiBaseURL"
              type="url"
              x-model="apiBaseURL"
              class="p-1 w-72 bg-input text-input focus-2"
              placeholder="https://api.openai.com/v1/"
            />
          </li>

          <li class="m-1">
            <label for="apiKey">API Key</label>
            <input
              id="apiKey"
              type="password"
              x-model="apiKey"
              class="p-1 w-72 bg-input text-input focus-2"
            />
          </li>

          <li class="m-1 flex-grow">
            <label for="model">Model </label>
            <input
              id="model"
              type="text"
              x-model="model"
              class="p-1 bg-input text-input focus-2"
            />
          </li>

          <span class="text-lg underline text-max">Permissions</span>

          <li class="m-1">
            <span
              class="cursor-pointer transition-all duration-25 hover:font-bold"
              x-bind:class="{ 'text-orange-500': nonsense }"
              x-on:click="nonsense = !nonsense"
              >Block nonsense</span
            >
          </li>

          <li class="m-1">
            <span
              class="cursor-pointer transition-all duration-25 hover:font-bold"
              x-bind:class="{ 'text-orange-500': shenanigans }"
              x-on:click="shenanigans = !shenanigans"
              >Allow arbitrary shenanigans</span
            >
          </li>

          <span class="text-lg underline text-max">Import/Export</span>

          <li />

          <span class="text-lg underline text-max">About</span>

          <li class="m-1">
            Made by Eric Izoita (<a href="mailto:ericizoita@gmail.com"
              >ericizoita@gmail.com</a
            >)
          </li>
        </ul>
      </div>

      <!-- TODO: context content -->
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
