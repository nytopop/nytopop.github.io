<!doctype html>
<html
  lang="en"
  x-data="{ theme: $persist('system') }"
  x-bind:class="{'dark': theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)}"
>
  <head>
    <meta charset="UTF-8" />
    <!-- TODO: icon -->
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mkit</title>
  </head>
  <body class="bg-main bg-selection font-mono" x-data="app">
    <!-- TODO(responsive): when screen is narrow, don't show settings gear or dark/light mode -->
    <!-- toolbar -->
    <div
      class="max-h-screen fixed inset-x-1 top-0 m-1 border-0 flex bg-stone-300 dark:bg-stone-800"
    >
      <!-- light / dark mode -->
      <!-- TODO: pressing this should not modify selection for consistency in omni bar and config -->
      <div class="flex-1 flex">
        <div
          class="m-1 mr-0 size-5 bg-neutral-100 cursor-pointer transition-all duration-25 hover:scale-105"
          x-bind:class="{ 'border-2 border-orange-500': theme === 'light' }"
          x-on:click="theme === 'light' ? theme = 'system': theme = 'light'"
        ></div>
        <div
          class="m-1 mr-0 size-5 bg-stone-600 cursor-pointer transition-all duration-25 hover:scale-105"
          x-bind:class="{ 'border-2 border-orange-500': theme === 'dark' }"
          x-on:click="theme === 'dark' ? theme = 'system' : theme = 'dark'"
        ></div>
      </div>

      <!-- omni bar -->
      <div
        class="flex-5 flex flex-col m-1"
        x-data="{ omni: '', text: false, list: false }"
      >
        <!-- TODO: consider persisting the contents of this input -->
        <!-- TODO: undo list of input procs -->
        <textarea
          placeholder="You can do anything in the omni bar—anything at all..."
          class="w-full pl-2 p-1 bg-input text-input focus-2 boxshadow-lg resize-none"
          x-model="omni"
          x-on:keydown.escape="$el.blur()"
          x-on:focus="text = true; autosize($el)"
          x-on:blur="text = false; collapse($el)"
          x-on:input="autosize($el)"
          x-on:input.debounce.200ms="await omnifunc(omni)"
          x-ref="bar"
        >
        </textarea>

        <!-- TODO: actions need +/- nice buttons to generate preference data -->
        <div
          class="text-neutral-500 dark:text-neutral-400"
          x-show="text || list"
          x-transition
        >
          <div
            class="flex-grow mt-2 m-1 p-1 bg-child boxshadow-lg focus-1"
            tabindex="0"
            x-on:click="$el.blur()"
            x-on:keydown.enter="$el.blur()"
            x-on:keydown.escape="$refs.bar.focus()"
            x-on:focus="list = true; autosize($refs.bar)"
            x-on:blur="list = false; collapse($refs.bar)"
          >
            placeholder 1
          </div>

          <div
            class="flex-grow mt-2 m-1 p-1 bg-child boxshadow-lg focus-1"
            tabindex="0"
            x-on:click="$el.blur()"
            x-on:keydown.enter="$el.blur()"
            x-on:keydown.escape="$refs.bar.focus()"
            x-on:focus="list = true; autosize($refs.bar)"
            x-on:blur="list = false; collapse($refs.bar)"
          >
            placeholder 2
          </div>

          <div
            class="flex-grow mt-2 m-1 p-1 bg-child boxshadow-lg focus-1"
            tabindex="0"
            x-on:click="$el.blur()"
            x-on:keydown.enter="$el.blur()"
            x-on:keydown.escape="$refs.bar.focus()"
            x-on:focus="list = true; autosize($refs.bar)"
            x-on:blur="list = false; collapse($refs.bar)"
          >
            placeholder 3
          </div>
        </div>
      </div>

      <!-- config button -->
      <div class="flex-1 flex justify-end">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-7 stroke-neutral-950 dark:stroke-neutral-300 cursor-pointer transition-all duration-25 hover:scale-105"
          x-bind:class="{ 'fill-orange-500': configmodal }"
          x-on:click="configmodal = !configmodal; if (configmodal) window.scrollTo(0, 0);"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 0 1 1.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.894.149c-.424.07-.764.383-.929.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 0 1-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.398.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 0 1-.12-1.45l.527-.737c.25-.35.272-.806.108-1.204-.165-.397-.506-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 0 1 .12-1.45l.773-.773a1.125 1.125 0 0 1 1.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894Z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          />
        </svg>
      </div>
    </div>

    <!-- TODO: with shift held, hovering over UI elements should display floating help windows -->

    <!-- config modal -->
    <div class="mt-24">
      <div
        class="flex justify-center"
        x-show="configmodal"
        x-transition
        x-cloak
      >
        <ul class="border-2 bg-child text-min text-right p-1 boxshadow-lg">
          <li class="cursor-default">
            <span
              class="select-none"
              x-data="{ status: 'unknown' }"
              x-init="status = await apistatus(); $watch('apiurl, apikey, model', () => { status = 'unknown'; $dispatch('argupdate'); });"
              x-on:argupdate.debounce.750ms="status = await apistatus()"
              x-on:click="status = await apistatus()"
              x-text="status"
              x-bind:class="{
                'animate-ping': status === 'unknown',
                'text-emerald-600': status === 'ok',
                'text-red-500': status !== 'unknown' && status !== 'ok',
              }"
            ></span>

            <span class="text-lg underline text-max">Inference</span>
          </li>

          <li class="m-1">
            <label for="apiurl">API URL</label>
            <input
              id="apiurl"
              type="url"
              placeholder="https://api.openai.com/v1/"
              class="p-1 w-72 bg-input text-input focus-2 boxshadow-sm"
              x-model="apiurl"
            />
          </li>

          <li class="m-1">
            <label for="apikey">API Key</label>
            <input
              id="apikey"
              type="password"
              class="p-1 w-72 bg-input text-input focus-2 boxshadow-sm"
              x-model="apikey"
            />
          </li>

          <li class="m-1">
            <label for="model">Model </label>
            <input
              id="model"
              type="text"
              placeholder="default"
              class="p-1 w-72 bg-input text-input focus-2 boxshadow-sm"
              x-model="model"
            />
          </li>

          <li class="text-lg underline text-max cursor-default">Tweaks</li>

          <li class="m-1 select-none">
            Glazing:
            <span
              class="cursor-pointer transition-all duration-25 hover:font-bold"
              x-bind:class="{ 'text-orange-500': glazing == 'suppress' }"
              x-on:click="glazing === 'suppress' ? glazing = null : glazing = 'suppress'"
              >suppress</span
            >
            /
            <span
              class="cursor-pointer transition-all duration-25 hover:font-bold"
              x-bind:class="{ 'text-orange-500': glazing == 'enforce' }"
              x-on:click="glazing === 'enforce' ? glazing = null : glazing = 'enforce'"
              >enforce</span
            >
          </li>

          <li class="m-1 select-none">
            Deception:
            <span
              class="cursor-pointer transition-all duration-25 hover:font-bold"
              x-bind:class="{ 'text-orange-500': deception == 'suppress' }"
              x-on:click="deception === 'suppress' ? deception = null : deception = 'suppress'"
              >suppress</span
            >
            /
            <span
              class="cursor-pointer transition-all duration-25 hover:font-bold"
              x-bind:class="{ 'text-orange-500': deception == 'enforce' }"
              x-on:click="deception === 'enforce' ? deception = null :  deception = 'enforce'"
              >enforce</span
            >
          </li>

          <li class="m-1 select-none">
            AI Slop:
            <span
              class="cursor-pointer transition-all duration-25 hover:font-bold"
              x-bind:class="{ 'text-orange-500': aislop == 'suppress' }"
              x-on:click="aislop === 'suppress' ? aislop = null : aislop = 'suppress'"
              >suppress</span
            >
            /
            <span
              class="cursor-pointer transition-all duration-25 hover:font-bold"
              x-bind:class="{ 'text-orange-500': aislop == 'enforce' }"
              x-on:click="aislop === 'enforce' ? aislop = null : aislop = 'enforce'"
              >enforce</span
            >
          </li>

          <li class="m-1">
            <label
              for="rolemodel"
              x-bind:class="{ 'text-orange-500': rolemodel }"
              >Would</label
            >

            <input
              id="rolemodel"
              type="text"
              class="px-1 bg-input text-input focus-2 boxshadow-sm"
              x-model="rolemodel"
            />

            <label
              for="rolemodel"
              x-bind:class="{ 'text-orange-500': rolemodel }"
              >do that?</label
            >
          </li>

          <!-- <li class="text-lg underline text-max">Import/Export</li> -->

          <hr class="mt-4 mb-2" />

          <li class="m-1">
            mkit ver
            <a
              title="host it yourself"
              class="text-max"
              x-bind:href="'https://git.sr.ht/~nytopop/mkit/commit/' + __GIT_VERSION_CLEAN__"
              x-text="__GIT_VERSION__"
            ></a>
          </li>

          <li class="m-1">
            by
            <span title="not an AI">Eric Izoita</span>
            <a
              class="text-max"
              href="mailto:ericizoita@gmail.com"
              title="we love emails"
              >ericizoita@gmail.com</a
            >
          </li>

          <li class="m-1">
            under
            <a class="text-max" href="https://www.gnu.org/licenses/agpl-3.0.txt"
              >AGPL-3.0-or-later</a
            >
          </li>

          <!-- TODO: errata -->
          <!-- <li class="m-1"> -->
          <!-- report -->
          <!-- <a class="text-max" href="">bugs</a> -->
          <!-- / request -->
          <!-- <a class="text-max" href="">features</a> -->
          <!-- </li> -->
        </ul>
      </div>

      <!-- TODO: context content -->
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
