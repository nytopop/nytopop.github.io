<!doctype html>
<html
  lang="en"
  x-data="{ theme: $persist('system') }"
  x-bind:class="{'dark': theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>mkit</title>
  </head>

  <body
    class="bg-main bg-selection font-sans overflow-y-hidden"
    x-data="app"
    x-resize.document="docwidth = $width"
  >
    <div class="max-h-screen w-full fixed mt-1 pointer-events-none">
      <div class="flex justify-center">
        <!-- L buttons -->
        <div class="flex flex-col pointer-events-auto">
          <div
            class="m-1 size-5 bg-neutral-100 cursor-pointer transition-all duration-25 hover:scale-105"
            x-bind:class="{ 'border-2 border-orange-500': theme === 'light' }"
            x-on:click="theme === 'light' ? theme = 'system': theme = 'light'"
          ></div>
          <div
            class="m-1 size-5 bg-stone-600 cursor-pointer transition-all duration-25 hover:scale-105"
            x-bind:class="{ 'border-2 border-orange-500': theme === 'dark' }"
            x-on:click="theme === 'dark' ? theme = 'system' : theme = 'dark'"
          ></div>
        </div>

        <!-- action select -->
        <div
          class="flex-auto max-w-3xl max-h-screen flex flex-col font-mono relative"
          x-data="{ input: '', focused: false }"
        >
          <textarea
            class="z-1 flex-grow p-1 bg-input text-input focus-2 boxshadow-lg resize-none pointer-events-auto relative"
            x-model="input"
            x-on:keydown.escape="$el.blur()"
            x-on:focus="focused = true; autosize($el); await omnifunc(input)"
            x-on:blur="focused = false; collapse($el)"
            x-on:input="autosize($el)"
            x-on:input.debounce.200ms="await omnifunc(input)"
            x-ref="bar"
          >
          </textarea>

          <span
            class="text-xs pointer-events-none absolute top-1.5 right-1"
            x-bind:class="configmodal ? 'text-orange-500' : 'text-min' "
            x-show="input.length == 0"
            >cfg
          </span>

          <span
            class="text-xs text-min pointer-events-none px-1"
            x-text="tokenusage"
            x-anchor.bottom-end.offset.-20="$refs.bar"
          >
          </span>

          <div
            class="z-2 flex flex-col mb-1 pointer-events-auto"
            x-show="focused"
            x-transition
            x-cloak
          >
            <div class="m-0.5"></div>

            <template x-for="(action, ix) in actions">
              <div
                class="m-1 px-1 bg-child-2 rounded-xs boxshadow-lg focus-2 ring-2 text-min cursor-pointer"
                tabindex="0"
                x-on:click="$el.blur(); doaction(ix)"
                x-on:keydown.enter="$el.blur(); doaction(ix)"
                x-on:keydown.escape="$refs.bar.focus()"
                x-on:focus="focused = true; autosize($refs.bar)"
                x-on:blur="focused = false; collapse($refs.bar)"
              >
                <span class="text-soft" x-text="action.show"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- R button -->
        <div class="flex flex-col pointer-events-auto">
          <div
            class="m-1 size-5 bg-stone-400 cursor-pointer transition-all duration-25 hover:scale-105 boxshadow-lg"
            x-bind:class="{ 'border-2 border-orange-500': configmodal }"
            x-on:click="configmodal = !configmodal; if (configmodal) $refs.track0.scrollTo(0, 0);"
          ></div>

          <div
            class="m-1 size-5 bg-stone-400 cursor-pointer transition-all duration-25 hover:scale-105 boxshadow-lg"
            x-bind:class="{ 'border-2 border-orange-500': configmodal }"
            x-on:click="configmodal = !configmodal; if (configmodal) $refs.track0.scrollTo(0, 0);"
          ></div>
        </div>
      </div>
    </div>

    <!-- context content -->
    <div class="flex max-h-screen">
      <!-- track1 -->
      <div class="flex-grow flex overflow-y-auto be-rtl" tabindex="-1">
        <div class="ml-3 mr-0.5 w-xl be-ltr" x-show="docwidth > 820">
          <!-- input spacer -->
          <div class="mt-17"></div>

          <!-- TODO: fill w/ content from context -->
          <div
            class="my-2 bg-child p-1 boxshadow-lg text-soft hyphens-auto text-justify"
            x-text="lorem(48)"
          ></div>
        </div>
      </div>

      <!-- track0 -->
      <div class="flex-grow flex overflow-y-auto" tabindex="-1" x-ref="track0">
        <div class="ml-0.5 mr-3 w-xl">
          <!-- input spacer -->
          <div class="mt-17"></div>

          <!-- config modal -->
          <div
            class="flex flex-row my-2"
            x-show="configmodal"
            x-transition
            x-cloak
          >
            <!-- spacer (TODO: render graphic of a tree/plant) -->
            <div
              class="mr-0.5 flex-grow boxshadow-lg bg-stone-800 pyramid"
            ></div>

            <ul
              class="ml-0.5 flex-shrink bg-child text-min text-right p-1 boxshadow-lg overflow-x-hidden font-mono"
            >
              <li>
                <span
                  class="select-none cursor-pointer"
                  x-data="{ status: 'unknown' }"
                  x-init="status = await apistatus(); $watch('apiurl, apikey, model', () => { status = 'unknown'; $dispatch('argupdate'); });"
                  x-on:argupdate.debounce.750ms="status = await apistatus()"
                  x-on:click="status = await apistatus()"
                  x-text="status"
                  x-bind:class="{
                'animate-ping': status === 'unknown',
                'text-emerald-600': status === 'ok',
                'text-red-500': status !== 'unknown' && status !== 'ok',
              }"
                ></span>

                <span class="text-lg underline text-max cursor-default"
                  >Inference</span
                >
              </li>

              <li class="m-1">
                <label for="apiurl">API URL</label>
                <input
                  id="apiurl"
                  type="url"
                  placeholder="https://api.openai.com/v1/"
                  class="p-1 w-72 bg-input text-input focus-2 boxshadow-sm"
                  x-model="apiurl"
                />
              </li>

              <li class="m-1">
                <label for="apikey">API Key</label>
                <input
                  id="apikey"
                  type="password"
                  class="p-1 w-72 bg-input text-input focus-2 boxshadow-sm"
                  x-model="apikey"
                />
              </li>

              <li class="m-1">
                <label for="model">Model </label>
                <input
                  id="model"
                  type="text"
                  placeholder="default"
                  class="p-1 w-72 bg-input text-input focus-2 boxshadow-sm"
                  x-model="model"
                />
              </li>

              <li class="text-lg underline text-max cursor-default">Tweaks</li>

              <li class="m-1 cursor-default">
                Glazing:
                <span
                  class="cursor-pointer transition-all duration-25 hover:font-bold"
                  x-bind:class="{ 'text-orange-500': glazing == 'suppress' }"
                  x-on:click="glazing === 'suppress' ? glazing = null : glazing = 'suppress'"
                  >suppress</span
                >
                /
                <span
                  class="cursor-pointer transition-all duration-25 hover:font-bold"
                  x-bind:class="{ 'text-orange-500': glazing == 'enforce' }"
                  x-on:click="glazing === 'enforce' ? glazing = null : glazing = 'enforce'"
                  >enforce</span
                >
              </li>

              <li class="m-1 cursor-default">
                Deception:
                <span
                  class="cursor-pointer transition-all duration-25 hover:font-bold"
                  x-bind:class="{ 'text-orange-500': deception == 'suppress' }"
                  x-on:click="deception === 'suppress' ? deception = null : deception = 'suppress'"
                  >suppress</span
                >
                /
                <span
                  class="cursor-pointer transition-all duration-25 hover:font-bold"
                  x-bind:class="{ 'text-orange-500': deception == 'enforce' }"
                  x-on:click="deception === 'enforce' ? deception = null :  deception = 'enforce'"
                  >enforce</span
                >
              </li>

              <li class="m-1 cursor-default">
                Slop:
                <span
                  class="cursor-pointer transition-all duration-25 hover:font-bold"
                  x-bind:class="{ 'text-orange-500': aislop == 'suppress' }"
                  x-on:click="aislop === 'suppress' ? aislop = null : aislop = 'suppress'"
                  >suppress</span
                >
                /
                <span
                  class="cursor-pointer transition-all duration-25 hover:font-bold"
                  x-bind:class="{ 'text-orange-500': aislop == 'enforce' }"
                  x-on:click="aislop === 'enforce' ? aislop = null : aislop = 'enforce'"
                  >enforce</span
                >
              </li>

              <li class="m-1">
                <label
                  for="rolemodel"
                  x-bind:class="{ 'text-orange-500': rolemodel }"
                  >Would</label
                >

                <input
                  id="rolemodel"
                  type="text"
                  class="px-1 bg-input text-input focus-2 boxshadow-sm"
                  x-model="rolemodel"
                />

                <label
                  for="rolemodel"
                  x-bind:class="{ 'text-orange-500': rolemodel }"
                  >do that?</label
                >
              </li>

              <hr class="mt-4 mb-2" />

              <li class="m-1" x-data="git">
                mkit ver
                <a
                  title="the source"
                  class="text-max"
                  x-bind:href="'https://git.sr.ht/~nytopop/mkit/commit/' + versionclean"
                  x-text="version"
                ></a>
              </li>

              <li class="m-1">
                by
                <span title="not an AI">Eric Izoita</span>
                <a
                  class="text-max"
                  href="mailto:ericizoita@gmail.com"
                  title="we love email"
                  >ericizoita@gmail.com</a
                >
              </li>

              <li class="m-1">
                under
                <a
                  class="text-max"
                  href="https://www.gnu.org/licenses/agpl-3.0.txt"
                  >AGPL-3.0-or-later</a
                >
              </li>

              <li class="m-1">
                <a class="text-max" href="https://todo.sr.ht/~nytopop/mkit"
                  >bugs</a
                >
                |
                <a
                  class="text-max"
                  href="https://lists.sr.ht/~nytopop/mkit-devel"
                  >discuss</a
                >
              </li>
            </ul>
          </div>

          <!-- TODO: fill w/ content from context -->
          <div
            class="my-2 bg-child p-1 boxshadow-lg text-soft hyphens-auto text-justify"
            x-text="lorem(16)"
          ></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
